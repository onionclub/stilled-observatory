<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF9F6"/>
      <stop offset="100%" stop-color="#F0EDE4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B7355" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C8BCA8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="grain"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <!-- architectural framework lines -->
  <line x1="120" y1="200" x2="120" y2="800" stroke="#C8BCA8" stroke-width="0.5" opacity="0.3"/>
  <line x1="680" y1="200" x2="680" y2="800" stroke="#C8BCA8" stroke-width="0.5" opacity="0.3"/>
  <line x1="120" y1="200" x2="680" y2="200" stroke="#C8BCA8" stroke-width="0.5" opacity="0.3"/>
  <!-- central form -->
  <rect x="200" y="250" width="400" height="500" rx="2" stroke="#8B7355" stroke-width="1" fill="url(#accent)" opacity="0.5"/>
  <circle cx="400" cy="450" r="120" stroke="#1A1A1A" stroke-width="0.5" fill="none" opacity="0.15"/>
  <circle cx="400" cy="450" r="80" stroke="#1A1A1A" stroke-width="0.5" fill="none" opacity="0.1"/>
  <!-- text label -->
  <text x="400" y="930" text-anchor="middle" font-family="Georgia, serif" font-size="14" letter-spacing="0.15em" fill="#1A1A1A" opacity="0.4">META-FRAMEWORK</text>
  <!-- grain overlay -->
  <rect width="800" height="1000" fill="none" filter="url(#grain)" opacity="0.3"/>
</svg>
